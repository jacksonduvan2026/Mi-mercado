<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5a46">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <title>Mi mercado</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", Nunito, "Segoe UI", system-ui, sans-serif;
      --bg: #f2f5ef;
      --card: #fff;
      --ink: #17231e;
      --muted: #506359;
      --brand: #1f5a46;
      --on-brand: #fff;
      --line: #d6e2d9;
      --soft: #e8f0e8;
      --yellow: #ffd84a;
      --shadow: 0 12px 30px #213f2d10;
      --composer-height: 8rem;
      --gutter: clamp(1rem, 4vw, 2rem);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101a16;
        --card: #18251f;
        --ink: #eff8f0;
        --muted: #b0c6b9;
        --brand: #5fc79e;
        --on-brand: #10291f;
        --line: #375146;
        --soft: #22382d;
        --shadow: 0 12px 30px #0004;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-padding-block-end: calc(var(--composer-height) + 1rem); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }
    button, input, select, textarea { font: inherit; }
    button, input, select { min-height: 44px; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    h1, h2, p { margin: 0; }
    .container {
      width: min(100%, 49rem);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    header {
      padding-block: calc(1.5rem + env(safe-area-inset-top)) 1.25rem;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .heading { display: flex; align-items: center; gap: .85rem; }
    .heading img { width: 52px; height: 52px; border-radius: 16px; }
    h1 { font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.05; letter-spacing: -.06em; }
    .progress-card {
      margin-top: 1.25rem;
      padding: .95rem 1rem 1rem;
      border-radius: 1rem;
      background: var(--soft);
    }
    .progress-card p { margin-bottom: .55rem; color: var(--brand); font-weight: 750; }
    progress {
      display: block;
      width: 100%;
      height: .55rem;
      overflow: hidden;
      border: 0;
      border-radius: 1rem;
      background: var(--line);
      color: var(--brand);
      appearance: none;
    }
    progress::-webkit-progress-bar { background: var(--line); border-radius: inherit; }
    progress::-webkit-progress-value { background: var(--brand); border-radius: inherit; }
    progress::-moz-progress-bar { background: var(--brand); border-radius: inherit; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-block: 1.1rem;
    }
    .button {
      min-width: 44px;
      padding: .55rem .8rem;
      border: 1px solid var(--line);
      border-radius: .8rem;
      background: var(--card);
      color: var(--brand);
      font-weight: 720;
    }
    .primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
    main { padding-bottom: calc(var(--composer-height) + 1.5rem); }
    .empty {
      display: grid;
      justify-items: center;
      gap: .65rem;
      padding: clamp(1.5rem, 6vh, 3.6rem) 1.25rem;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .empty img { width: 85px; height: 85px; margin-bottom: .3rem; border-radius: 1.5rem; }
    .empty h2 { font-size: clamp(1.4rem, 5vw, 1.8rem); letter-spacing: -.035em; }
    .empty p { max-width: 34ch; color: var(--muted); line-height: 1.55; }
    .aisle + .aisle { margin-top: 1.35rem; }
    .aisle-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .35rem .75rem;
      margin-bottom: .5rem;
    }
    .aisle-header h2 {
      font-size: 1.13rem;
      letter-spacing: -.025em;
      color: color-mix(in srgb, var(--aisle) 74%, var(--ink));
    }
    .aisle-header span {
      border-radius: 2rem;
      padding: .23rem .6rem;
      background: color-mix(in srgb, var(--aisle) 13%, var(--card));
      color: var(--ink);
      font-size: .82rem;
      font-weight: 650;
    }
    .products, .saved-items { display: grid; gap: .48rem; margin: 0; padding: 0; list-style: none; }
    .product {
      display: flex;
      align-items: center;
      gap: .15rem;
      padding: .2rem .15rem .2rem .35rem;
      border: 1px solid var(--line);
      border-inline-start: 4px solid var(--aisle);
      border-radius: .85rem;
      background: var(--card);
    }
    .product.purchased { background: var(--soft); }
    .toggle {
      display: flex;
      flex: 1;
      align-items: center;
      gap: .55rem;
      min-width: 0;
      padding: .4rem .22rem;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: start;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .check {
      flex: 0 0 1.3rem;
      display: grid;
      place-items: center;
      width: 1.3rem;
      height: 1.3rem;
      border: 1.5px solid var(--muted);
      border-radius: .35rem;
    }
    .purchased .check { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    .purchased .product-name { color: var(--muted); text-decoration: line-through; }
    .quantity {
      display: flex;
      align-items: center;
      border-radius: .65rem;
      background: var(--bg);
      font-variant-numeric: tabular-nums;
    }
    .quantity span { min-width: 1rem; text-align: center; font-weight: 720; }
    .icon-button {
      min-width: 40px;
      padding: 0;
      border: 0;
      border-radius: .6rem;
      background: transparent;
      color: var(--brand);
      font-size: 1.2rem;
      font-weight: 700;
    }
    .composer {
      position: fixed;
      z-index: 1;
      inset: auto 0 0;
      padding-block: .75rem calc(.8rem + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--card);
      box-shadow: 0 -8px 32px #213f2d12;
    }
    .suggestions {
      display: flex;
      gap: .45rem;
      overflow-x: auto;
      padding: .23rem .23rem .45rem;
      margin: -.23rem -.23rem .3rem;
    }
    .suggestion {
      flex: 0 0 auto;
      max-width: 80%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 0;
      border-radius: 2rem;
      padding: .4rem .8rem;
      background: var(--yellow);
      color: #3a2f00;
      font-size: .88rem;
      font-weight: 750;
    }
    .add-form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    input, select, textarea {
      padding: .55rem .6rem;
      border: 1px solid var(--line);
      border-radius: .75rem;
      background: var(--bg);
      color: var(--ink);
    }
    input::placeholder { color: var(--muted); opacity: 1; }
    .add-form input { flex: 1 1 7rem; min-width: 0; }
    .add-form select { max-width: min(100%, 27vw); }
    .add-form select:has(option[value="auto"]:checked) { width: 4.6rem; }
    @media (min-width: 40rem) {
      .add-form select { max-width: none; }
      .product { gap: .35rem; padding-inline: .55rem .4rem; }
    }
    .toast {
      position: fixed;
      z-index: 2;
      inset: auto var(--gutter) calc(var(--composer-height) + .6rem);
      width: fit-content;
      max-width: min(36rem, calc(100% - var(--gutter) * 2));
      margin-inline: auto;
      padding: .7rem 1rem;
      border-radius: .85rem;
      background: var(--ink);
      color: var(--card);
      box-shadow: var(--shadow);
      pointer-events: none;
      overflow-wrap: anywhere;
    }
    dialog {
      width: min(32rem, calc(100% - 2rem));
      max-height: min(75dvh, 38rem);
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 1.2rem;
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: #101a1680; }
    .dialog-heading { display: flex; justify-content: space-between; align-items: center; gap: .7rem; }
    .save-form { display: flex; flex-wrap: wrap; gap: .5rem; margin-block: 1rem; }
    .save-form input { flex: 1 1 10rem; min-width: 0; }
    .saved-items li {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .45rem;
      padding: .55rem;
      border-radius: .8rem;
      background: var(--bg);
    }
    .saved-name { flex: 1 1 8rem; font-weight: 700; overflow-wrap: anywhere; }
    .dialog-message { color: var(--muted); overflow-wrap: anywhere; }
    #saved-status:not(:empty) { margin-top: .6rem; }
    #share-text { width: 100%; margin-block: .75rem; resize: vertical; }
    @media (prefers-reduced-motion: no-preference) {
      progress::-webkit-progress-value { transition: width .2s ease; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="heading">
        <img src="./icon-192.png" alt="">
        <h1>Mi mercado</h1>
      </div>
      <div class="progress-card">
        <p id="progress-label" aria-live="polite">0 de 0 en el carrito</p>
        <progress id="progress" aria-label="Progreso de la compra" max="1" value="0"></progress>
      </div>
    </div>
  </header>
  <main class="container">
    <div class="actions">
      <button id="saved-open" class="button" type="button">Listas guardadas</button>
      <button id="clear-purchased" class="button" type="button" disabled>Quitar comprados</button>
      <button id="share" class="button" type="button" disabled>Compartir</button>
    </div>
    <div id="empty" class="empty">
      <img src="./icon-192.png" alt="">
      <h2>Empieza tu lista.</h2>
      <p>Escribe un producto abajo y lo ubico en su pasillo automáticamente.</p>
    </div>
    <div id="aisles"></div>
  </main>

  <div id="composer" class="composer">
    <div class="container">
      <div id="suggestions" class="suggestions" role="group" aria-label="Sugerencias de productos" hidden></div>
      <form id="add-form" class="add-form">
        <label class="sr-only" for="product">Producto</label>
        <input id="product" type="text" placeholder="Producto…" autocomplete="off" enterkeyhint="done" maxlength="120" required>
        <label class="sr-only" for="aisle">Pasillo</label>
        <select id="aisle"><option value="auto">Auto</option></select>
        <button class="button primary" type="submit">Agregar</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="saved-dialog" aria-labelledby="saved-heading">
    <div class="dialog-heading">
      <h2 id="saved-heading">Listas guardadas</h2>
      <form method="dialog"><button class="button" type="submit">Cerrar</button></form>
    </div>
    <form id="save-form" class="save-form">
      <label class="sr-only" for="list-name">Nombre de la lista</label>
      <input id="list-name" type="text" placeholder="Mercado semanal" maxlength="80" required>
      <button id="save-current" class="button primary" type="submit">Guardar actual</button>
    </form>
    <ul id="saved-items" class="saved-items"></ul>
    <p id="saved-empty" class="dialog-message">Aún no tienes listas guardadas.</p>
    <p id="saved-status" class="dialog-message" role="status"></p>
  </dialog>

  <dialog id="share-dialog" aria-labelledby="share-heading">
    <h2 id="share-heading">Copiar lista</h2>
    <label class="sr-only" for="share-text">Productos pendientes</label>
    <textarea id="share-text" rows="8" readonly></textarea>
    <form method="dialog"><button class="button" type="submit">Cerrar</button></form>
  </dialog>

  <script>
    'use strict';

    const AISLES = [
      { id: 'produce', name: 'Frutas y verduras', color: '#2f9e44', keywords: 'aguacate|ajo|apio|arandano|banano|berenjena|brocoli|calabacin|calabaza|cebolla|cebolla larga|champiñon|cilantro|col|coliflor|espinaca|fresa|lechuga|limon|mandarina|mango|manzana|melon|mora|naranja|papa|papaya|pepino|pera|pimenton|piña|platano|repollo|sandia|tomate|uva|yuca|zanahoria' },
      { id: 'meat', name: 'Carnes y pescado', color: '#c2410c', keywords: 'atun|bacon|bistec|camaron|carne|cerdo|chorizo|costilla|filete|jamon|lomo|marisco|merluza|mortadela|muslo|pechuga|pescado|pollo|res|salchicha|salmon|tilapia|tocino|trucha' },
      { id: 'dairy', name: 'Lácteos y huevos', color: '#2b7fd3', keywords: 'crema de leche|cuajada|huevo|kumis|leche|mantequilla|margarina|nata|queso|yogur|yogurt' },
      { id: 'bakery', name: 'Panadería', color: '#b7791f', keywords: 'baguette|bizcocho|croissant|dona|pan|pan de molde|pandebono|pastel|ponque|torta' },
      { id: 'pantry', name: 'Despensa', color: '#8a5cf6', keywords: 'aceite|aceituna|arroz|atun en lata|avena|azucar|cacao|cafe|cereal|chocolate|comino|conserva|espagueti|fideo|frijol|galleta|garbanzo|harina|lenteja|maiz|mayonesa|mermelada|miel|mostaza|pan rallado|panela|papa frita|pasta|pimienta|sal|salsa|sopa instantanea|te|vinagre' },
      { id: 'drinks', name: 'Bebidas', color: '#0e9aa7', keywords: 'agua|agua con gas|agua mineral|aguardiente|bebida|cerveza|gaseosa|jugo|limonada|refresco|ron|soda|te helado|vino' },
      { id: 'frozen', name: 'Congelados', color: '#4c6ef5', keywords: 'congelado|fruta congelada|helado|hielo|nugget|papa congelada|papa frita congelada|pescado congelado|pizza congelada|verdura congelada' },
      { id: 'home', name: 'Aseo del hogar', color: '#d6336c', keywords: 'ambientador|bolsa de basura|cloro|desengrasante|desinfectante|detergente|esponja|jabón para ropa|lavaplatos|lejia|limpiavidrios|limpiador|papel higienico|papel de cocina|servilleta|suavizante|trapeador' },
      { id: 'care', name: 'Cuidado personal', color: '#a24ca8', keywords: 'acondicionador|bloqueador|cepillo de dientes|champu|crema corporal|crema dental|desodorante|enjuague bucal|gel de baño|hilo dental|jabon|jabon de manos|pañal|pasta dental|protector solar|shampoo|tampon|toalla sanitaria' },
      { id: 'other', name: 'Otros', color: '#6b7a72', keywords: '' }
    ];
    const STORAGE_KEY = 'mi-mercado-v1';
    const cleanSpaces = value => value.trim().replace(/\s+/g, ' ');
    const normalize = value => cleanSpaces(value.toLowerCase()
      .normalize('NFD').replace(/\p{M}/gu, ''));
    const words = value => normalize(value).match(/[\p{L}\p{N}]+/gu) || [];

    function wordForms(word) {
      const plural = word.endsWith('z') ? word.slice(0, -1) + 'ces' : word + 'es';
      return new Set([word, word + 's', plural]);
    }

    const keywords = AISLES.flatMap(aisle => aisle.keywords.split('|').filter(Boolean).map(keyword => ({
      aisle: aisle.id,
      length: normalize(keyword).length,
      forms: words(keyword).map(wordForms)
    }))).sort((a, b) => b.length - a.length);

    function classify(name) {
      const tokens = words(name);
      for (const { aisle, forms } of keywords) {
        if (tokens.some((_, start) => forms.every((variants, offset) => variants.has(tokens[start + offset])))) {
          return aisle;
        }
      }
      return 'other';
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return {
          items: Array.isArray(saved?.items) ? saved.items : [],
          history: Array.isArray(saved?.history) ? saved.history : [],
          lists: Array.isArray(saved?.lists) ? saved.lists : []
        };
      } catch {
        return { items: [], history: [], lists: [] };
      }
    }

    const state = loadState();
    const byId = id => document.getElementById(id);
    const productInput = byId('product');
    const aisleSelect = byId('aisle');
    const savedDialog = byId('saved-dialog');
    const listName = byId('list-name');
    let toastTimer;

    function element(tag, className, content) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (content !== undefined) node.textContent = content;
      return node;
    }

    function button(label, className, onClick, accessibleLabel) {
      const node = element('button', className, label);
      node.type = 'button';
      if (accessibleLabel) node.setAttribute('aria-label', accessibleLabel);
      node.addEventListener('click', onClick);
      return node;
    }

    function announce(message) {
      const toast = byId('toast');
      toast.hidden = false;
      toast.textContent = message;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.hidden = true;
        toast.textContent = '';
      }, 3000);
    }

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {
        if (savedDialog.open) {
          byId('saved-status').textContent = 'El navegador no pudo guardar los cambios en este dispositivo.';
        } else {
          announce('El navegador no pudo guardar los cambios en este dispositivo.');
        }
      }
    }

    for (const aisle of AISLES) {
      const option = element('option', '', aisle.name);
      option.value = aisle.id;
      aisleSelect.append(option);
    }

    function addItem(name, aisle, quantity = 1) {
      const key = normalize(name);
      const existing = state.items.find(item => item.key === key);
      if (existing) {
        existing.quantity += quantity;
        if (aisle !== 'auto') existing.aisle = aisle;
      } else {
        state.items.push({
          key, name, aisle: aisle === 'auto' ? classify(name) : aisle,
          quantity, purchased: false
        });
      }

      const item = existing || state.items.at(-1);
      const previous = state.history.find(entry => entry.key === key);
      if (previous) {
        previous.aisle = item.aisle;
        previous.count += 1;
      } else {
        state.history.push({ key, name: item.name, aisle: item.aisle, count: 1 });
      }
      return existing;
    }

    function commit() {
      persist();
      render();
    }

    function finishAdd(name, aisle) {
      const existing = addItem(name, aisle);
      if (existing) announce(`«${existing.name}» ya está en la lista. Cantidad: ${existing.quantity}.`);
      productInput.value = '';
      aisleSelect.value = 'auto';
      commit();
      productInput.focus();
    }

    function renderSuggestions() {
      const suggestions = byId('suggestions');
      const query = normalize(productInput.value);
      const listed = new Set(state.items.map(item => item.key));
      const matches = state.history
        .filter(entry => !listed.has(entry.key) && entry.key.includes(query))
        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'es'))
        .slice(0, 8);
      suggestions.replaceChildren(...matches.map(entry => button(entry.name, 'suggestion', () => {
        finishAdd(entry.name, aisleSelect.value === 'auto' ? entry.aisle : aisleSelect.value);
      })));
      suggestions.hidden = matches.length === 0;
    }

    function renderProduct(item) {
      const row = element('li', item.purchased ? 'product purchased' : 'product');
      row.dataset.key = item.key;
      const toggle = button('', 'toggle', () => {
        item.purchased = !item.purchased;
        commit();
      }, item.purchased ? `Desmarcar ${item.name}` : `Marcar ${item.name} como comprado`);
      toggle.dataset.action = 'toggle';
      const check = element('span', 'check', item.purchased ? '✓' : '');
      check.setAttribute('aria-hidden', 'true');
      toggle.append(check, element('span', 'product-name', item.name));

      const quantity = element('div', 'quantity');
      const decrease = button('−', 'icon-button', () => {
        item.quantity = Math.max(1, item.quantity - 1);
        commit();
      }, `Restar una unidad de ${item.name}`);
      decrease.disabled = item.quantity === 1;
      decrease.dataset.action = 'decrease';
      const increase = button('+', 'icon-button', () => {
        item.quantity += 1;
        commit();
      }, `Sumar una unidad de ${item.name}`);
      increase.dataset.action = 'increase';
      const amount = element('span', '', item.quantity);
      amount.setAttribute('aria-label', `Cantidad: ${item.quantity}`);
      quantity.append(decrease, amount, increase);

      const remove = button('×', 'icon-button', () => {
        state.items = state.items.filter(candidate => candidate.key !== item.key);
        commit();
      }, `Quitar ${item.name}`);
      remove.dataset.action = 'remove';
      row.append(toggle, quantity, remove);
      return row;
    }

    function render() {
      const aisles = byId('aisles');
      const focused = document.activeElement;
      const focusedRow = focused.closest('.product');
      const purchased = state.items.filter(item => item.purchased).length;
      const total = state.items.length;
      byId('progress').max = total || 1;
      byId('progress').value = purchased;
      byId('progress-label').textContent = `${purchased} de ${total} en el carrito`;
      byId('empty').hidden = total > 0;
      byId('clear-purchased').disabled = purchased === 0;
      byId('share').disabled = purchased === total;
      byId('save-current').disabled = total === 0;

      const sections = document.createDocumentFragment();
      for (const aisle of AISLES) {
        const items = state.items.filter(item => item.aisle === aisle.id);
        if (items.length === 0) continue;
        const pending = items.filter(item => !item.purchased);
        const bought = items.filter(item => item.purchased);
        const section = element('section', 'aisle');
        section.style.setProperty('--aisle', aisle.color);
        const header = element('div', 'aisle-header');
        const title = element('h2', '', aisle.name);
        title.id = `section-${aisle.id}`;
        section.setAttribute('aria-labelledby', title.id);
        header.append(title, element('span', '', `${pending.length} por comprar`));
        const list = element('ul', 'products');
        list.append(...pending.map(renderProduct), ...bought.map(renderProduct));
        section.append(header, list);
        sections.append(section);
      }
      aisles.replaceChildren(sections);
      renderSuggestions();

      if (focusedRow) {
        const row = [...aisles.querySelectorAll('.product')].find(candidate => candidate.dataset.key === focusedRow.dataset.key);
        const target = row?.querySelector(`[data-action="${focused.dataset.action}"]`);
        (target && !target.disabled ? target : row?.querySelector('.toggle') ||
          aisles.querySelector('.toggle') || productInput).focus();
      }
    }

    function renderSaved() {
      byId('saved-empty').hidden = state.lists.length > 0;
      byId('saved-items').replaceChildren(...state.lists.map(list => {
        const row = element('li');
        const name = element('span', 'saved-name', list.name);
        const use = button('Usar lista', 'button', () => {
          for (const item of list.items) addItem(item.name, item.aisle, item.quantity);
          savedDialog.close();
          announce(`Se agregó la lista «${list.name}».`);
          commit();
        }, `Usar lista «${list.name}»`);
        const remove = button('Borrar', 'button', () => {
          state.lists = state.lists.filter(candidate => candidate !== list);
          byId('saved-status').textContent = `Se borró la lista «${list.name}».`;
          persist();
          renderSaved();
          listName.focus();
        }, `Borrar lista «${list.name}»`);
        row.append(name, use, remove);
        return row;
      }));
    }

    byId('add-form').addEventListener('submit', event => {
      event.preventDefault();
      const name = cleanSpaces(productInput.value);
      if (!name) {
        announce('Escribe un producto para agregarlo.');
        productInput.focus();
        return;
      }
      finishAdd(name, aisleSelect.value);
    });
    productInput.addEventListener('input', renderSuggestions);

    byId('saved-open').addEventListener('click', () => {
      byId('saved-status').textContent = '';
      renderSaved();
      savedDialog.showModal();
    });

    byId('save-form').addEventListener('submit', event => {
      event.preventDefault();
      const name = cleanSpaces(listName.value);
      const status = byId('saved-status');
      if (!name) {
        status.textContent = 'Escribe un nombre para guardar la lista.';
        listName.focus();
        return;
      }
      if (!state.items.length) return;
      const items = state.items.map(({ name, aisle, quantity }) => ({ name, aisle, quantity }));
      const existing = state.lists.find(list => normalize(list.name) === normalize(name));
      if (existing) {
        status.textContent = 'Ya existe una lista con ese nombre. Elige otro nombre.';
        listName.focus();
        return;
      }
      state.lists.push({ name, items });
      listName.value = '';
      status.textContent = `Se guardó la lista «${name}».`;
      persist();
      renderSaved();
    });

    byId('clear-purchased').addEventListener('click', () => {
      const before = state.items.length;
      state.items = state.items.filter(item => !item.purchased);
      const removed = before - state.items.length;
      announce(removed === 1 ? 'Se quitó 1 producto comprado.' : `Se quitaron ${removed} productos comprados.`);
      commit();
      byId('saved-open').focus();
    });

    function shareText() {
      const groups = [];
      for (const aisle of AISLES) {
        const pending = state.items.filter(item => item.aisle === aisle.id && !item.purchased);
        if (pending.length > 0) {
          groups.push([aisle.name, ...pending.map(item => `- ${item.name} x${item.quantity}`)].join('\n'));
        }
      }
      return ['Mi mercado', ...groups].join('\n\n');
    }

    byId('share').addEventListener('click', async () => {
      const text = shareText();
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Mi mercado', text });
          return;
        } catch (error) {
          if (error.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(text);
        announce('Lista copiada al portapapeles.');
      } catch {
        const field = byId('share-text');
        field.value = text;
        byId('share-dialog').showModal();
        field.focus();
        field.select();
      }
    });

    new ResizeObserver(([entry]) => {
      document.documentElement.style.setProperty('--composer-height', `${entry.target.offsetHeight}px`);
    }).observe(byId('composer'));

    render();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          announce('No se pudo preparar el modo sin conexión.');
        });
      });
    }
  </script>
</body>
</html>
